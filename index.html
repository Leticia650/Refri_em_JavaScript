<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refri animado!</title>
</head>
<body>
    <main>

        <div class="item active" style="--background:#EA3D41">
            <div class="title">Morango</div>
            <img src="imagem/teste_morangos.png" alt="morangos" class="fruit">
            <img src="imagem/Morango-refrigerante.png" alt="refrigerante de morango" class="refri">
        </div>



        <div class="item" style="--background: #2D5643">
            <div class="title">Abacate</div>
            <img src="imagem/teste_abacate.png" alt="abacates" class="fruit">
            <img src="imagem/Abacate-refrigerante.png" alt="refrigerante de abacate" class="refri">
        </div>




        <div class="item" style="--background: #E7A043">
            <div class="title">Laranja</div>
            <img src="imagem/teste_laranja.png" alt="laranjas" class="fruit">
            <img src="imagem/Laranja-refrigerante.png" alt="refrigerante de laranja" class="refri">
        </div>


        <div class="arrow">

            <button id="prev"> < </button>
            <button id="next"> > </button>
        </div>

    </main>
</body>
<script src="script.js"></script>
</html>
